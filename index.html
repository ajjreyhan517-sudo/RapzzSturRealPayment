<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAYMENT RAPZZ OFFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background: #080812 url('https://cdn.phototourl.com/member/2026-10-06-d4af8c38-0760-488e-b634-59752795106d.jpg') no-repeat center center fixed;
  background-size:cover;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
body::before{
  content:''; position:fixed; inset:0;
  background: url('https://cdn.phototourl.com/member/2026-10-06-d1ff6e09-5316-4fc8-9bb8-f4462e98ce0e.png') center/cover no-repeat;
  opacity:0.22; pointer-events:none;
  filter: hue-rotate(20deg);
}
body::after{
  content:''; position:fixed; inset:0;
  background: radial-gradient(circle at center, rgba(15,15,30,0.2) 0%, rgba(5,5,15,0.95) 90%);
  pointer-events:none;
}
.card{
  position:relative; z-index:2;
  width:100%; max-width:430px;
  background: rgba(16,16,28,0.88);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(139,92,246,0.35);
  border-radius: 30px;
  padding: 30px 22px 26px;
  box-shadow: 0 0 60px rgba(139,92,246,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  text-align:center;
}
.glow{
  position:absolute; top:-2px; left:50%; transform:translateX(-50%);
  width:70%; height:2px;
  background: linear-gradient(90deg,transparent,#8b5cf6,#ec4899,transparent);
  filter: blur(1px);
}
.title{
  font-family:'Orbitron',sans-serif;
  font-weight:900; font-size:26px; line-height:1.1;
  background: linear-gradient(90deg,#a78bfa,#f472b6,#60a5fa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  letter-spacing:2px;
}
.sub{color:#9ca3af; font-size:11px; letter-spacing:4px; margin-top:6px; margin-bottom:18px}
.badge{display:inline-block; background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); color:#a78bfa; font-size:10px; padding:4px 12px; border-radius:20px; letter-spacing:2px; margin-bottom:16px}

.qris-wrap{
  background:#ffffff;
  border-radius:22px;
  padding:12px;
  box-shadow: 0 0 30px rgba(167,139,250,0.5);
  position:relative;
  overflow:hidden;
}
.qris-wrap img{width:100%; border-radius:14px; display:block}
.qris-label{font-family:'Orbitron'; font-weight:700; color:#fff; margin:16px 0 8px; font-size:13px; letter-spacing:3px}

.btn{
  width:100%; padding:13px; border:none; border-radius:14px;
  font-weight:700; font-size:13px; cursor:pointer;
  letter-spacing:1px; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(0.97)}
.btn-qris{
  background: linear-gradient(90deg,#e0e7ff,#c7d2fe);
  color:#4338ca; box-shadow:0 4px 15px rgba(255,255,255,0.2);
  margin-top:12px;
}
.btn-dana{
  background: linear-gradient(90deg,#6366f1,#a855f7);
  color:#fff; box-shadow:0 4px 18px rgba(99,102,241,0.5);
}

.dana-box{
  margin-top:18px;
  background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(236,72,153,0.12));
  border:1px solid rgba(139,92,246,0.3);
  border-radius:18px; padding:16px;
}
.dana-title{font-family:'Orbitron'; color:#818cf8; font-weight:800; font-size:16px}
.dana-num{font-size:23px; font-weight:800; color:#fff; margin:6px 0; letter-spacing:1px}
.dana-an{font-size:12px; color:#a5b4fc; margin-bottom:12px}

.note{
  margin-top:16px; font-size:11.5px; line-height:1.6;
  color:#fdba74; background: rgba(251,146,60,0.08);
  border:1px dashed rgba(251,146,60,0.35);
  padding:11px 14px; border-radius:12px;
}
.btn-wa{
  margin-top:16px; width:100%; padding:14px; border-radius:16px;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  color:#fff; text-decoration:none; font-weight:800; font-size:14px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 6px 22px rgba(34,197,94,0.45);
}
.btn-wa:hover{transform:translateY(-2px)}

.toast{
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(120px);
  background:#111827; color:#fff; padding:12px 22px; border-radius:30px;
  font-size:13px; font-weight:600; z-index:999; opacity:0; transition:0.45s;
  border:1px solid rgba(139,92,246,0.4);
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1}
</style>
</head>
<body>

<div class="card">
  <div class="glow"></div>
  <div class="badge">OFFICIAL STORE</div>
  <div class="title">WELCOME TO</div>
  <div class="title">PAYMENT RAPZZ</div>
  <div class="sub">FAST • SAFE • TRUSTED</div>

  <div class="qris-label">QRIS ALL PAYMENT</div>
  <div class="qris-wrap">
    <img id="qrisImg" src="https://cdn.phototourl.com/member/2026-10-06-c4436cee-8162-4c16-a0f0-947bdcd6c919.jpg" alt="QRIS RAPZZ">
  </div>
  <button class="btn btn-qris" onclick="downloadQRIS()">⬇️ KLIK UNTUK DOWNLOAD QRIS</button>

  <div class="dana-box">
    <div class="dana-title">DANA</div>
    <div class="dana-num" id="danaNum">085788018206</div>
    <div class="dana-an">a/n suyanto</div>
    <button class="btn btn-dana" onclick="copyDana()">📋 KLIK UNTUK SALIN</button>
  </div>

  <div class="note">
    <b>NOTE:</b> JIKA SUDAH MENGIRIM SALDO HARAP KIRIM BUKTI TF KE WA ADMIN
  </div>

  <a class="btn-wa" href="https://wa.me/6282372306293" target="_blank">
    💬 KLIK UNTUK KE WA ADMIN
  </a>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg){
  const t=document.getElementById('toast');
  t.innerText=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function copyDana(){
  const num=document.getElementById('danaNum').innerText;
  navigator.clipboard.writeText(num).then(()=>{
    showToast('✅ Nomor DANA disalin: '+num);
  });
}

async function downloadQRIS(){
  const imgUrl = document.getElementById('qrisImg').src;
  showToast('⏳ Mendownload QRIS...');
  try{
    // coba download via fetch biar work di HP
    const res = await fetch(imgUrl);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'QRIS-PAYMENT-RAPZZ.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('✅ QRIS berhasil didownload!');
  }catch(e){
    // fallback kalau kena CORS
    const a = document.createElement('a');
    a.href = imgUrl;
    a.download = 'QRIS-PAYMENT-RAPZZ.jpg';
    a.target = '_blank';
    a.click();
    showToast('✅ Membuka QRIS, tahan gambar untuk simpan');
  }
}
</script>
</body>
</html>
